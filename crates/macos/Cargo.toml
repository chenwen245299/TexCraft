[package]
name = "texcraft-macos"
description = "macOS window chrome that winit does not expose (traffic-light placement). The one crate with unsafe code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.5.1"
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSWindow", "NSView", "NSVisualEffectView", "NSColor", "NSGraphics", "NSResponder", "NSButton", "NSControl", "NSSpellChecker"] }
objc2-foundation = { version = "0.2.2", features = ["NSGeometry", "NSThread", "NSString", "NSRange", "NSArray", "NSEnumerator", "NSFileManager", "NSURL", "NSError", "NSNotification", "NSOperation", "block2"] }

# Not `lints.workspace`: this crate needs `unsafe_code = "deny"` (overridable per module) instead
# of the workspace's `forbid`. Everything else matches the workspace.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
undocumented_unsafe_blocks = "deny"
