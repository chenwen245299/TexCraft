# Dependabot keeps the pinned GitHub Actions (commit hashes in .github/workflows) and the Rust
# dependencies (Cargo.lock) current with weekly pull requests; security fixes come as soon as an
# advisory is published (turn on "Dependabot security updates" in the repository settings).
# Every pull request runs the leak scan and the dependency audit.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Minor and patch updates in one pull request; major ones each on their own.
      cargo-minor:
        update-types: [minor, patch]
