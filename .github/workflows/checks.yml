# The repository's checks: leak scan, dependency audit and the live preview contract.
#
#   push to main      all
#   pull request      all (Dependabot's too)
#   weekly (Monday)   the dependency audit only: new advisories appear without any change here
#   by hand           all (Actions › Checks › Run workflow)
#
# Version tags are not checked here: release.yml runs the same gates before it builds.

name: Checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leaks:
    name: Leak scan
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/secrets.yml

  dependencies:
    name: Dependency audit
    uses: ./.github/workflows/audit.yml

  preview:
    name: Live preview contract
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/preview.yml
