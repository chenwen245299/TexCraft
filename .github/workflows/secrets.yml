# Leak scan with gitleaks and .gitleaks.toml: secrets (API keys, tokens, private keys,
# passwords), private files and personal paths, in the whole git history and in the current
# files (inside .gz/.zip too). Never runs on its own: checks.yml calls it on pushes to main and
# pull requests, release.yml before a release. The backstop for the local pre-commit hook
# (scripts/install-hooks.sh). A finding fails the run; the log shows file, line and rule with
# the secret redacted.

name: Leak scan

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit or tag to scan (default: the triggering one)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum checked)
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose --config .gitleaks.toml .
      - name: Scan the current files, archives included
        run: |
          mkdir "$RUNNER_TEMP/tree"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/tree"
          cd "$RUNNER_TEMP/tree"
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner --verbose --max-archive-depth 3 \
            --config "$GITHUB_WORKSPACE/.gitleaks.toml" .
