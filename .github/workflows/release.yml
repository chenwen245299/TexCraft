# Builds TexCraft for macOS (universal) and Windows (x64) when a version tag is pushed, and
# publishes a GitHub release with what people install from (a .dmg, scripts/make-dmg.sh; a
# Setup .exe, scripts/windows-installer.iss), the archives the app's updater downloads, and
# latest.json (the manifest it reads from releases/latest/download/latest.json). The release
# page shows the tag's notes followed by scripts/ci/download.md.
#
#   git tag -a v0.2.0 -m "What changed (shown in the app's update window)"
#   git push origin v0.2.0
#
# Tags with a suffix (v0.2.0-beta.1) become pre-releases, which the updater does not offer.
#
# Hardening: nothing is built before the leak scan and the dependency audit pass; only the
# publishing job can write to the repository (the build jobs run dependencies' build scripts);
# actions are pinned to commits (Dependabot proposes updates); no build cache (a poisoned cache
# could slip into a release); the checkout does not keep the token.

name: Release
run-name: Release ${{ github.event.inputs.tag || github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build again, e.g. v0.2.0"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        env:
          # Through the environment, never pasted into the script (it may come from the form).
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $TAG is not vMAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  secrets:
    name: Leak scan
    needs: version
    uses: ./.github/workflows/secrets.yml
    with:
      ref: ${{ needs.version.outputs.tag }}

  audit:
    name: Dependency audit
    needs: version
    uses: ./.github/workflows/audit.yml
    with:
      ref: ${{ needs.version.outputs.tag }}

  macos:
    name: Build macOS
    needs: [version, secrets, audit]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Use the tag's version
        run: perl -pi -e 's/^version = "[^"]*"/version = "${{ needs.version.outputs.version }}"/' Cargo.toml
      - name: Build (Apple silicon + Intel)
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --target "$t" -p texcraft -p texcraft-cli
          done
          mkdir -p target/release
          for b in texcraft texcraft-cli; do
            lipo -create -output "target/release/$b" \
              "target/aarch64-apple-darwin/release/$b" "target/x86_64-apple-darwin/release/$b"
          done
      - name: Bundle, sign (ad hoc), zip and disk image
        env:
          TEXCRAFT_SKIP_BUILD: "1"
        run: |
          sh scripts/bundle-macos.sh
          codesign --force --deep --sign - target/macos/TexCraft.app
          # The zip is what the updater downloads, the disk image what people install from.
          ditto -c -k --keepParent target/macos/TexCraft.app \
            "TexCraft-${{ needs.version.outputs.version }}-macos.zip"
          sh scripts/make-dmg.sh target/macos/TexCraft.app \
            "TexCraft-${{ needs.version.outputs.version }}-macos.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: |
            TexCraft-*-macos.zip
            TexCraft-*-macos.dmg
          if-no-files-found: error

  windows:
    name: Build Windows
    needs: [version, secrets, audit]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Use the tag's version
        shell: bash
        run: perl -pi -e 's/^version = "[^"]*"/version = "${{ needs.version.outputs.version }}"/' Cargo.toml
      - name: Build
        run: cargo build --release -p texcraft -p texcraft-cli
      - name: Zip
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          New-Item -ItemType Directory -Force TexCraft | Out-Null
          Copy-Item target/release/texcraft.exe, target/release/texcraft-cli.exe, README.md, ATTRIBUTION.md TexCraft
          Compress-Archive -Path TexCraft -DestinationPath "TexCraft-$v-windows-x64.zip"
      - name: Installer
        shell: pwsh
        run: |
          # The zip is what the updater downloads, the installer what people install from.
          # Inno Setup comes with GitHub's Windows images.
          $v = "${{ needs.version.outputs.version }}"
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$v" "/DFileVersion=$($v.Split('-')[0])" "/O$PWD" scripts\windows-installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: |
            TexCraft-*-windows-x64.zip
            TexCraft-*-windows-x64-setup.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      # Creating the release and uploading its files.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from the tag message
        shell: bash
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          # An annotated tag's message (a lightweight tag gives the commit message).
          git tag -l --format='%(contents)' "$TAG" | sed '/-----BEGIN PGP SIGNATURE-----/,$d' > dist/notes.md
          cat dist/notes.md
          # The release page adds which file to download and how to install it; the app's
          # update window (latest.json) shows the notes alone.
          { cat dist/notes.md; echo; sed "s/{{VERSION}}/${{ needs.version.outputs.version }}/g" scripts/ci/download.md; } > dist/body.md
      - name: Write latest.json
        run: |
          python3 scripts/ci/latest_json.py "${{ needs.version.outputs.version }}" \
            "${{ needs.version.outputs.tag }}" "${{ github.repository }}" dist dist/notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: TexCraft ${{ needs.version.outputs.version }}
          body_path: dist/body.md
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/*-setup.exe
            dist/*.zip
            dist/latest.json
