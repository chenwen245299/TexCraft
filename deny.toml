# Dependency checks with cargo-deny (https://github.com/EmbarkStudios/cargo-deny), run by CI
# (.github/workflows/audit.yml, run by checks.yml) on pushes to main, pull requests and weekly:
#
#   advisories  no dependency with a known vulnerability (RustSec), or yanked or unmaintained
#   licenses    permissive licences only (AGENTS.md: open source, clean-room)
#   bans        no wildcard version requirements
#   sources     crates come from crates.io only
#
# Locally: cargo deny check

[graph]
all-features = true

[advisories]
# Unmaintained crates are reported only for direct dependencies (deep ones are not ours to swap).
unmaintained = "workspace"
yanked = "deny"
# An advisory we accept, with the reason, goes here: { id = "RUSTSEC-…", reason = "…" }
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    # egui's bundled default fonts.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
